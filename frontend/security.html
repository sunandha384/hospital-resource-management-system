<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustCare Hospital - Security Department</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard-container">

    <div class="page-header">
        <h1>Security Department</h1>

        <a href="staff.html" class="back-btn">
            ← Staff Dashboard
        </a>
    </div>

    <div class="stats-container">

        <div class="stat-card">
            <h2>40</h2>
            <p>Total Staff</p>
        </div>

        <div class="stat-card">
            <h2>4</h2>
            <p>Supervisors</p>
        </div>

        <div class="stat-card">
            <h2>3</h2>
            <p>Control Room Staff</p>
        </div>

        <div class="stat-card">
            <h2>33</h2>
            <p>Security Personnel</p>
        </div>

    </div>

    <input
        type="text"
        id="staffSearch"
        placeholder="Search Security Staff..."
        class="search-box"
    >

    <table class="data-table">

        <thead>
            <tr>
                <th>Staff ID</th>
                <th>Name</th>
                <th>Designation</th>
                <th>Shift</th>
                <th>Experience</th>
                <th>Phone</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="securityTableBody">
</tbody>

    </table>

</div>

<script src="script.js"></script>

</body>
</html>
