<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustCare Hospital - Laboratory Department</title>
    <link rel="icon" type="image/png" href="images/trustcare-logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard-container">

    <div class="page-header">
        <h1>Laboratory Department</h1>

        <a href="staff.html" class="back-btn">
            ← Staff Dashboard
        </a>
    </div>

    <div class="stats-container">

        <div class="stat-card">
            <h2>12</h2>
            <p>Total Lab Staff</p>
        </div>

        <div class="stat-card">
            <h2>3</h2>
            <p>Senior Technicians</p>
        </div>

        <div class="stat-card">
            <h2>5</h2>
            <p>Lab Technicians</p>
        </div>

        <div class="stat-card">
            <h2>3</h2>
            <p>Lab Assistants</p>
        </div>

    </div>

    <input
        type="text"
        id="staffSearch"
        placeholder="Search Laboratory Staff..."
        class="search-box"
    >

    <table class="data-table">

        <thead>
            <tr>
                <th>Lab ID</th>
<th>Name</th>
<th>Role</th>
<th>Specialization</th>
<th>Shift</th>
<th>Experience</th>
<th>Phone</th>
<th>Status</th>
            </tr>
        </thead>

       <tbody id="laboratoryTableBody">
</tbody>

    </table>

</div>

<script src="script.js"></script>

</body>
</html>
