<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustCare Hospital - Beds Management</title>
    <link rel="icon" type="image/png" href="images/trustcare-logo.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard-container">

    <div class="page-header">
        <h1>Beds Management</h1>

        <a href="menu.html" class="back-btn">
            ← Dashboard
        </a>
    </div>

    <div class="stats-container">

        <div class="stat-card">
            <h2>50</h2>
            <p>Total Beds</p>
        </div>

        <div class="stat-card">
            <h2>30</h2>
            <p>Available Beds</p>
        </div>

        <div class="stat-card">
            <h2>15</h2>
            <p>Occupied Beds</p>
        </div>

        <div class="stat-card">
            <h2>5</h2>
            <p>ICU Beds</p>
        </div>

    </div>

    <input
        type="text"
        id="staffSearch"
        placeholder="Search Bed / Patient..."
        class="search-box"
    >

    <table class="data-table">

        <thead>
            <tr>
                <th>Bed ID</th>
                <th>Ward</th>
                <th>Room No</th>
                <th>Bed No</th>
                <th>Patient Name</th>
                <th>Doctor</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="bedTableBody">
            <!-- Data will come from script.js -->
        </tbody>

    </table>

</div>

<script src="script.js"></script>

</body>
</html>
